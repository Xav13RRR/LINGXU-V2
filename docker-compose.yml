    MEETING_ASSISTANT_LLM_BASE_URL: ${MEETING_ASSISTANT_LLM_BASE_URL:-http://lingxu-ollama:11434/v1}
    MEETING_ASSISTANT_LLM_MODEL: ${MEETING_ASSISTANT_LLM_MODEL:-qwen3.5:9b}
    MEETING_ASSISTANT_LLM_MODEL_DIGEST: ${MEETING_ASSISTANT_LLM_MODEL_DIGEST:-6488c96fa5faab64bb65cbd30d4289e20e6130ef535a93ef9a49f42eda893ea7}
    MEETING_ASSISTANT_LLM_TIMEOUT_SECONDS: ${MEETING_ASSISTANT_LLM_TIMEOUT_SECONDS:-30}
    MEETING_ASSISTANT_LLM_MAX_OUTPUT_TOKENS: ${MEETING_ASSISTANT_LLM_MAX_OUTPUT_TOKENS:-64}
    MEETING_ASSISTANT_MAX_QUESTION_CHARS: ${MEETING_ASSISTANT_MAX_QUESTION_CHARS:-500}
    MEETING_ASSISTANT_LLM_ALLOW_REMOTE: ${MEETING_ASSISTANT_LLM_ALLOW_REMOTE:-false}
    RESIDENT_ASSISTANT_ENABLED: ${RESIDENT_ASSISTANT_ENABLED:-true}
    RESIDENT_ASSISTANT_RECOVER_ON_RESTART: ${RESIDENT_ASSISTANT_RECOVER_ON_RESTART:-true}
