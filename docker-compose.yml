    MEETING_ASSISTANT_WAKEWORD_MODEL_DIGEST: ${MEETING_ASSISTANT_WAKEWORD_MODEL_DIGEST:-9604d8412a76c099ef8eecedb95fa04d523cb16df2f6a6be724bc956a92870ef}
