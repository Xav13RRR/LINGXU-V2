name: lingxu

x-lingxu-app-build: &lingxu-app-build
  context: .
  target: runtime
  args:
    BUILD_VERSION: ${LINGXU_BUILD_VERSION:-0.1.0}
    BUILD_REVISION: ${LINGXU_BUILD_REVISION:-unknown}
    BUILD_SOURCE: ${LINGXU_BUILD_SOURCE:-https://github.com/Xav13RRR/LINGXU-V2}

x-lingxu-tts-build: &lingxu-tts-build
  context: .
  dockerfile: Dockerfile.cosyvoice
  args:
    COSYVOICE_REPO_SHA: 074ca6dc9e80a2f424f1f74b48bdd7d3fea531cc
    TTS_BUILD_FINGERPRINT: ${LINGXU_TTS_BUILD_FINGERPRINT:-unknown}

x-lingxu-common: &lingxu-common
  image: ${LINGXU_APP_IMAGE:-lingxu-app}:${LINGXU_APP_IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  environment: &lingxu-bot-environment
    DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
    DISCORD_TEST_GUILD_ID: ${DISCORD_TEST_GUILD_ID:-}
    DATABASE_URL: sqlite+aiosqlite:////data/lingxu.db
    DATA_ROOT: /data/sessions
    GLOSSARY_ROOT: /data/glossaries
    RUNTIME_TMP: /runtime
    MODEL_CACHE_DIR: /models
    MODELSCOPE_CACHE: /models/modelscope
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    VOICE_DUPLEX_DAVE_READY_TIMEOUT_SECONDS: ${VOICE_DUPLEX_DAVE_READY_TIMEOUT_SECONDS:-15}
    WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
    WORKER_JOB_LOCK_SECONDS: ${WORKER_JOB_LOCK_SECONDS:-600}
    WORKER_JOB_MAX_ATTEMPTS: ${WORKER_JOB_MAX_ATTEMPTS:-3}
    REQUIRE_REALTIME_ASR_CONSENT: ${REQUIRE_REALTIME_ASR_CONSENT:-true}
    REALTIME_ASR_PROVIDER: ${REALTIME_ASR_PROVIDER:-sensevoice}
    REALTIME_ASR_MODEL: ${REALTIME_ASR_MODEL:-iic/SenseVoiceSmall}
    REALTIME_ASR_MODEL_REVISION: ${REALTIME_ASR_MODEL_REVISION:-master}
