    REALTIME_ASR_VAD_MODEL: ${REALTIME_ASR_VAD_MODEL:-fsmn-vad}
    REALTIME_ASR_VAD_MODEL_REVISION: ${REALTIME_ASR_VAD_MODEL_REVISION:-v2.0.4}
    REALTIME_ASR_VAD_MODEL_SHA256: ${REALTIME_ASR_VAD_MODEL_SHA256:-b3be75be477f0780277f3bae0fe489f48718f585f3a6e45d7dd1fbb1a4255fc5}
    REALTIME_ASR_LANGUAGE_MODE: ${REALTIME_ASR_LANGUAGE_MODE:-auto}
    REALTIME_ASR_HOTWORDS: ${REALTIME_ASR_HOTWORDS:-}
    REALTIME_ASR_TIMEOUT_SECONDS: ${REALTIME_ASR_TIMEOUT_SECONDS:-8}
    REALTIME_ASR_MAX_CONCURRENCY: ${REALTIME_ASR_MAX_CONCURRENCY:-1}
    REALTIME_ASR_QUEUE_MAX_FRAMES_PER_USER: ${REALTIME_ASR_QUEUE_MAX_FRAMES_PER_USER:-500}
    REALTIME_ASR_QUEUE_MAX_UTTERANCES: ${REALTIME_ASR_QUEUE_MAX_UTTERANCES:-32}
    REALTIME_ASR_VAD_THRESHOLD: ${REALTIME_ASR_VAD_THRESHOLD:-500}
    REALTIME_ASR_VAD_START_MS: ${REALTIME_ASR_VAD_START_MS:-60}
    REALTIME_ASR_VAD_END_MS: ${REALTIME_ASR_VAD_END_MS:-800}
    REALTIME_ASR_MIN_UTTERANCE_MS: ${REALTIME_ASR_MIN_UTTERANCE_MS:-300}
    REALTIME_ASR_MAX_UTTERANCE_SECONDS: ${REALTIME_ASR_MAX_UTTERANCE_SECONDS:-30}
    MEETING_ASSISTANT_ENABLED: ${MEETING_ASSISTANT_ENABLED:-true}
    MEETING_ASSISTANT_WAKE_PHRASE: ${MEETING_ASSISTANT_WAKE_PHRASE:-呼叫指挥中心}
