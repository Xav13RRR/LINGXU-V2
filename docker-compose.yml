    MEETING_ASSISTANT_VAD_END_MS: ${MEETING_ASSISTANT_VAD_END_MS:-800}
    MEETING_ASSISTANT_MIN_UTTERANCE_MS: ${MEETING_ASSISTANT_MIN_UTTERANCE_MS:-300}
