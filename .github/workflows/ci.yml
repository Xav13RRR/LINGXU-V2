name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Install pinned uv
        run: python -m pip install uv==0.9.2
      - name: Repository publication boundary
        run: python -m scripts.check_public_files
      - name: Sync locked dependencies
        run: uv sync --all-extras --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Complexity regression ceiling
        run: uv run ruff check src --select C901 --config "lint.mccabe.max-complexity=55"
      - name: Secret scan
        run: uv run python scripts/scan_secrets.py
      - name: CPU Compose profile
        run: docker compose -f docker-compose.yml config --quiet
      - name: GPU Compose profile
        run: docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Golden Compose profile
        run: docker compose -f docker-compose.yml -f docker-compose.golden.yml --profile golden config --quiet
      - name: Build package
        run: uv build
      - name: Smoke packaged wheel resource
        run: |
          python -m venv "$RUNNER_TEMP/lingxu-wheel-smoke"
          "$RUNNER_TEMP/lingxu-wheel-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/lingxu-wheel-smoke/bin/python" -c "from lingxu.resources import deepseek_full_transcript_minutes_template as resource; payload = resource().read_bytes(); assert payload.startswith(b'# ') and b'{{' in payload and len(payload) <= 64000"
      - name: Doctor
        run: uv run python -m lingxu.cli.doctor

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.11"
      - name: Install pinned uv
        run: python -m pip install uv==0.9.2
      - name: Sync locked dependencies
        run: uv sync --all-extras --frozen
      - name: Pytest
        run: uv run pytest
      - name: Filesystem boundary tests (Linux)
        run: >-
          uv run pytest -q -rA
          tests/unit/test_entity_normalisation.py::test_glossary_symlink_escape_is_rejected
          tests/unit/test_secret_scan.py::test_secret_scan_rejects_linked_ancestor_before_reading_outside_root

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application container
        run: >-
          docker build
          --build-arg BUILD_VERSION=0.1.0
          --build-arg BUILD_REVISION=${{ github.sha }}
          --build-arg BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
          --tag lingxu-ci .

  windows-quality:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
      - name: Install pinned uv
        run: python -m pip install uv==0.9.2
      - name: Sync locked dependencies
        run: uv sync --all-extras --frozen
      - name: Type-check source and supported scripts
        run: uv run mypy
      - name: Windows paths, launcher, and configuration
        run: >-
          uv run pytest
          tests/unit/test_windows_launcher.py
          tests/unit/test_session_files_paths.py
          tests/unit/test_entity_normalisation.py
          tests/unit/test_config.py
